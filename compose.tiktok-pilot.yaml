services:
  command:
    environment:
      TIKTOK_WORKER_URL: http://tiktok-worker:3000
      TIKTOK_WORKER_KEY: ${TIKTOK_WORKER_KEY}
  tiktok-worker:
    build: ../multichat-command/experimental/tiktok-worker
    init: true
    shm_size: 1gb
    ports:
      - "127.0.0.1:6080:6080"
    environment:
      TIKTOK_WORKER_KEY: ${TIKTOK_WORKER_KEY}
      TIKTOK_STORAGE_KEY: ${TIKTOK_STORAGE_KEY}
      TIKTOK_MAX_SESSIONS: ${TIKTOK_MAX_SESSIONS:-4}
      TIKTOK_LOGIN_PUBLIC_URL: ${TIKTOK_LOGIN_PUBLIC_URL:-http://localhost:6080}
      TIKTOK_USERNAME: galindogamerbr
    volumes:
      - tiktok-pilot-session:/data
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  tiktok-pilot-session:
