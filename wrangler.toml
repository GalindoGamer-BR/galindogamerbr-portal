name = "galindogamerbr-portal"
pages_build_output_dir = "dist"
compatibility_date = "2026-05-01"

# Sem bindings D1/KV: o Pages e so frontend + o proxy functions/[[path]].ts (nao usa banco nem KV).
# O proxy envia as chamadas /api, /oauth, /webhooks e /discord para a VM (Cloudflare Tunnel) com o header x-origin-auth.
# ORIGIN_AUTH_SECRET e SECRET do Pages (nao fica aqui): scripts/setup-pages.sh do deploy-platform.
[vars]
ENVIRONMENT = "production"
API_ORIGIN = "https://origin.galindogamerbr.com.br"

# Workers Logs da Cloudflare — persiste console.log/warn/error de cada
# invocação (consultável em Workers & Pages → galindogamerbr-portal →
# Logs, sem precisar de wrangler tail ao vivo nem serviço externo).
[observability]
enabled = true
