name: Deploy Preview

# O backend do preview vem do ambiente *Preview* do projeto Pages: API_ORIGIN (URL do backend
# do preview) e ORIGIN_AUTH_SECRET. Ver README.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Interruptor da vinculacao do TikTok no frontend (variavel do repositorio TIKTOK_LINKING_ENABLED=true liga).
          VITE_TIKTOK_LINKING_ENABLED: ${{ vars.TIKTOK_LINKING_ENABLED }}
          VITE_YOUTUBE_LINKING_ENABLED: ${{ vars.YOUTUBE_LINKING_ENABLED }}

      # Todo preview publica sob o mesmo alias fixo (--branch=preview abaixo),
      # não o nome da branch de verdade — só existe "o" preview atual, nunca
      # um por branch. Apaga qualquer deployment de preview anterior (de
      # qualquer branch) antes de publicar o novo, pra não acumular
      # deployments órfãos acessíveis pelas URLs com hash.
      - name: Apagar deployments de preview antigos
        run: |
          ids=$(npx wrangler pages deployment list --project-name=galindogamerbr-portal --environment=preview --json | jq -r '.[].Id')
          for id in $ids; do
            echo "Apagando deployment de preview antigo: $id"
            npx wrangler pages deployment delete "$id" --project-name=galindogamerbr-portal --force
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Alias fixo em vez do nome da branch — URL estável
      # (https://preview.galindogamerbr-hub-portal.pages.dev) pra qualquer
      # branch que rodar este workflow, em vez de uma URL nova por branch.
      - name: Deploy preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=galindogamerbr-portal --branch=preview
