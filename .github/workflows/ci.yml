name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build
        # O typecheck acima ja executou `tsc -b`; aqui basta o bundle do Vite mais o SEO por rota gerado no build
        # (scripts/seo-prerender.mjs), que e o dist/ que o deploy.yml publica.
        run: npx vite build && node scripts/seo-prerender.mjs dist
        env:
          # Mesmo interruptor do deploy: o dist/ gerado aqui e o que o deploy.yml publica.
          # Config publica do front (login/chat): a chave publishable e publica por definicao. Sem elas o
          # login nao funciona, porque o cliente do Supabase nao e criado (services.ts).
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_MULTICHAT_COMMAND_URL: ${{ vars.VITE_MULTICHAT_COMMAND_URL }}
          VITE_TIKTOK_LINKING_ENABLED: ${{ vars.TIKTOK_LINKING_ENABLED }}
          VITE_YOUTUBE_LINKING_ENABLED: ${{ vars.YOUTUBE_LINKING_ENABLED }}
          VITE_GOOGLE_LOGIN_ENABLED: ${{ vars.GOOGLE_LOGIN_ENABLED }}
          VITE_GOOGLE_LOGIN_YOUTUBE_ENABLED: ${{ vars.GOOGLE_LOGIN_YOUTUBE_ENABLED }}
          VITE_SEND_OUTBOX_ENABLED: ${{ vars.SEND_OUTBOX_ENABLED }}

      # deploy.yml (workflow_run, só dispara depois desse CI passar em main)
      # reusa esse artefato em vez de buildar de novo.
      - name: Upload do dist/ pro deploy.yml reusar
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist
          retention-days: 1

      # tsc -b só cobre o frontend; o proxy do Pages (functions/[[path]].ts) tem tsconfig próprio.
      - name: Typecheck da Pages Function (proxy)
        run: npx tsc -p functions/tsconfig.json

      - name: Build das Pages Functions (valida o proxy)
        run: npx wrangler pages functions build --outdir=/tmp/functions-build-check

      # Só nas dependências de produção — as de dev (wrangler etc.) têm
      # transitivas fora do nosso controle (ex: undici/ws) que não valem
      # travar todo PR por falta de fix upstream.
      - name: Audit de dependências de produção
        run: npm audit --omit=dev --audit-level=high
