name: Deploy
run-name: >-
  ${{ github.event_name == 'workflow_run'
      && format('Deploy: {0}', github.event.workflow_run.display_title)
      || format('Deploy manual: {0}', github.ref_name) }}

# Antes disparava em paralelo com o CI (mesmo evento push:main), sem
# depender do resultado — lint/typecheck/audit/sequência de migrations do
# ci.yml não eram gate real do deploy. Agora só dispara quando o CI
# terminar com sucesso em main (o filtro no job abaixo garante isso; o
# workflow_run em si já dispara pra qualquer conclusão/branch do CI).
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
  # Permite forçar um redeploy sem mudar código — útil pra pegar env vars
  # novas configuradas no dashboard da Cloudflare (nem sempre aplicam sem
  # um novo deploy). Sem workflow_run associado, builda direto (ver step
  # condicional abaixo).
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Reusa o dist/ já buildado no ci.yml pro mesmo push — evita buildar
      # duas vezes. Só existe quando disparado via workflow_run.
      - name: Baixar build do CI
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Redeploy manual (workflow_dispatch) não tem um run do CI associado
      # pra baixar artefato — builda aqui mesmo.
      - name: Build
        if: github.event_name == 'workflow_dispatch'
        run: npm run build
        env:
          # Interruptor da vinculacao do TikTok no frontend (variavel do repositorio TIKTOK_LINKING_ENABLED=true liga).
          # Config publica do front (login/chat): a chave publishable e publica por definicao. Sem elas o
          # login nao funciona, porque o cliente do Supabase nao e criado (services.ts).
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_MULTICHAT_COMMAND_URL: ${{ vars.VITE_MULTICHAT_COMMAND_URL }}
          VITE_TIKTOK_LINKING_ENABLED: ${{ vars.TIKTOK_LINKING_ENABLED }}
          VITE_YOUTUBE_LINKING_ENABLED: ${{ vars.YOUTUBE_LINKING_ENABLED }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=galindogamerbr-portal --branch=main
