name: galindo-multichat
services:
  db:
    image: postgres:17-alpine
    command: [postgres, -c, wal_level=logical, -c, max_replication_slots=20, -c, max_wal_senders=20]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute node scripts/multichat-env.mjs}
    volumes:
      - multichat-db:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
  auth:
    restart: on-failure
    image: supabase/gotrue:v2.196.0
    depends_on:
      db: { condition: service_healthy }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:54321/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:5173
      GOTRUE_URI_ALLOW_LIST: http://localhost:5173/**
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_EXTERNAL_TWITCH_ENABLED: "true"
      GOTRUE_EXTERNAL_TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      GOTRUE_EXTERNAL_TWITCH_SECRET: ${TWITCH_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_TWITCH_REDIRECT_URI: http://localhost:54321/auth/v1/callback
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_MAILER_OTP_EXP: 600
      GOTRUE_MAILER_OTP_LENGTH: 6
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-smtp.resend.com}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-465}
      GOTRUE_SMTP_USER: ${SMTP_USER:-resend}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_FROM:-acesso@galindogamerbr.com.br}
      GOTRUE_SMTP_SENDER_NAME: GalindoGamerBR
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://supabase:8000/auth-email.html
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://supabase:8000/auth-email.html
      GOTRUE_DISABLE_SIGNUP: "false"
    healthcheck:
      test: [CMD, wget, --spider, -q, http://localhost:9999/health]
      interval: 5s
      timeout: 3s
      retries: 30
  rest:
    image: postgrest/postgrest:v14.17
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
  realtime:
    image: supabase/realtime:v2.134.10
    depends_on:
      db: { condition: service_healthy }
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      RLIMIT_NOFILE: 10000
    healthcheck:
      test: [CMD-SHELL, "curl -sf -H 'Authorization: Bearer ${ANON_KEY}' http://localhost:4000/api/tenants/realtime-dev/health"]
      interval: 5s
      timeout: 5s
      retries: 40
  supabase:
    restart: on-failure
    image: nginx:1.28-alpine
    depends_on:
      auth: { condition: service_healthy }
      rest: { condition: service_started }
      realtime: { condition: service_healthy }
    ports: ["127.0.0.1:54321:8000"]
    volumes: ["./docker/nginx.conf:/etc/nginx/nginx.conf:ro", "./docker/auth-email.html:/usr/share/nginx/html/auth-email.html:ro"]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8000/auth/v1/health]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    image: postgres:17-alpine
    depends_on:
      auth: { condition: service_healthy }
      realtime: { condition: service_healthy }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ../multichat-command/supabase/migrations:/migrations:ro
      - ./docker/realtime.sql:/realtime.sql:ro
      - ./docker/migrate.sh:/migrate.sh:ro
    entrypoint: [/bin/sh, /migrate.sh]
  mock-platform:
    profiles: ["simulation"]
    image: node:22-bookworm-slim
    environment:
      MOCK_PLATFORM_SECRET: ${MOCK_PLATFORM_SECRET}
    volumes: ["../multichat-reader/scripts/mock-platform.mjs:/app/mock-platform.mjs:ro"]
    command: [node, /app/mock-platform.mjs]
  command:
    build: ../multichat-command
    depends_on:
      migrate: { condition: service_completed_successfully }
      supabase: { condition: service_healthy }
    ports: ["127.0.0.1:3001:3000"]
    environment:
      READER_URL: http://reader:3000
      INTERNAL_WAKE_SECRET: ${INTERNAL_WAKE_SECRET}
      PORT: 3000
      SUPABASE_URL: http://supabase:8000
      SUPABASE_SECRET_KEY: ${SERVICE_ROLE_KEY}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      FRONTEND_URL: http://localhost:5173
      TWITCH_REDIRECT_URI: http://localhost:3001/oauth/twitch/callback
      KICK_REDIRECT_URI: http://localhost:3001/oauth/kick/callback
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      TIKTOK_REDIRECT_URI: ${TIKTOK_REDIRECT_URI:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: http://localhost:3001/oauth/youtube/callback
      YOUTUBE_LIVE_CHAT_ID: ${YOUTUBE_LIVE_CHAT_ID:-}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      TWITCH_BROADCASTER_ID: ${TWITCH_BROADCASTER_ID:-}
      KICK_CLIENT_ID: ${KICK_CLIENT_ID:-}
      KICK_CLIENT_SECRET: ${KICK_CLIENT_SECRET:-}
      KICK_BROADCASTER_ID: ${KICK_BROADCASTER_ID:-}
      MOCK_PLATFORMS: "false"
      MOCK_PLATFORM_URL: http://mock-platform:3100
      MOCK_PLATFORM_SECRET: ${MOCK_PLATFORM_SECRET}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 20
  reader:
    build: ../multichat-reader
    depends_on:
      migrate: { condition: service_completed_successfully }
      supabase: { condition: service_healthy }
    ports: ["127.0.0.1:3002:3000"]
    environment:
      PORT: 3000
      SUPABASE_URL: http://supabase:8000
      SUPABASE_SECRET_KEY: ${SERVICE_ROLE_KEY}
      INTERNAL_WAKE_SECRET: ${INTERNAL_WAKE_SECRET}
      AUTO_START: "true"
      TWITCH_CHANNEL: galindogamerbr
      TWITCH_ACCESS_TOKEN: ${TWITCH_ACCESS_TOKEN:-}
      TWITCH_REFRESH_TOKEN: ${TWITCH_REFRESH_TOKEN:-}
      TWITCH_READER_USER_ID: ${TWITCH_READER_USER_ID:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YOUTUBE_LIVE_STATUS_URL: http://portal:5173/api/live
      TIKTOK_USERNAME: galindogamerbr
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      TWITCH_BROADCASTER_ID: ${TWITCH_BROADCASTER_ID:-}
      KICK_CLIENT_ID: ${KICK_CLIENT_ID:-}
      KICK_CLIENT_SECRET: ${KICK_CLIENT_SECRET:-}
      KICK_BROADCASTER_ID: ${KICK_BROADCASTER_ID:-}
      MOCK_PLATFORMS: "false"
      MOCK_PLATFORM_URL: http://mock-platform:3100
      MOCK_PLATFORM_SECRET: ${MOCK_PLATFORM_SECRET}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 20
  portal:
    build: .
    depends_on:
      command: { condition: service_healthy }
      reader: { condition: service_healthy }
    ports: ["127.0.0.1:5173:5173"]
    environment:
      MULTICHAT_DOCKER: "true"
      FS25_BISECT_API_KEY: ${FS25_BISECT_API_KEY:-}
      FS25_BISECT_SERVER_UUID: ${FS25_BISECT_SERVER_UUID:-}
      FS25_BISECT_PANEL_BASE_URL: ${FS25_BISECT_PANEL_BASE_URL:-}
      FS25_BISECT_PANEL_USERNAME: ${FS25_BISECT_PANEL_USERNAME:-}
      FS25_BISECT_PANEL_PASSWORD: ${FS25_BISECT_PANEL_PASSWORD:-}
      FS25_XML_CODE: ${FS25_XML_CODE:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YOUTUBE_CHANNEL_ID: ${YOUTUBE_CHANNEL_ID:-}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      VITE_SUPABASE_URL: http://localhost:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: ${ANON_KEY}
      VITE_MULTICHAT_COMMAND_URL: http://localhost:3001
      WRANGLER_SEND_METRICS: "false"
    volumes:
      - portal-state:/app/.wrangler
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:5173/multichat').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 20
    command: ["sh", "-c", "node scripts/multichat-worker-env.mjs && npm run db:migrate:local && npm run build && npx concurrently -k 'vite --host 0.0.0.0' 'wrangler pages dev dist --ip 0.0.0.0 --port 8788'"]
volumes:
  multichat-db:
  portal-state:
