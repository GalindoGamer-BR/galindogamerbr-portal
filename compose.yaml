name: galindo-multichat
services:
  db:
    image: postgres:17-alpine
    command: [postgres, -c, wal_level=logical, -c, max_replication_slots=20, -c, max_wal_senders=20]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute node scripts/multichat-env.mjs}
    volumes:
      - multichat-db:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
  auth:
    restart: on-failure
    image: supabase/gotrue:v2.196.0
    depends_on:
      db: { condition: service_healthy }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:54321/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:5173
      GOTRUE_URI_ALLOW_LIST: http://localhost:5173/**
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ISSUER: http://localhost:54321/auth/v1
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_EXTERNAL_TWITCH_ENABLED: "true"
      GOTRUE_EXTERNAL_TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      GOTRUE_EXTERNAL_TWITCH_SECRET: ${TWITCH_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_TWITCH_REDIRECT_URI: http://localhost:54321/auth/v1/callback
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_MAILER_OTP_EXP: 300
      GOTRUE_MAILER_OTP_LENGTH: 8
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-smtp.resend.com}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-465}
      GOTRUE_SMTP_USER: ${SMTP_USER:-resend}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_FROM:-acesso@galindogamerbr.com.br}
      GOTRUE_SMTP_SENDER_NAME: GalindoGamerBR
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://supabase:8000/auth-email.html
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://supabase:8000/auth-email.html
      GOTRUE_DISABLE_SIGNUP: "false"
    healthcheck:
      test: [CMD, wget, --spider, -q, http://localhost:9999/health]
      interval: 5s
      timeout: 3s
      retries: 30
  rest:
    image: postgrest/postgrest:v14.17
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,auth_service,multichat
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
  realtime:
    image: supabase/realtime:v2.134.10
    depends_on:
      db: { condition: service_healthy }
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      RLIMIT_NOFILE: 10000
    healthcheck:
      test: [CMD-SHELL, "curl -sf -H 'Authorization: Bearer ${ANON_KEY}' http://localhost:4000/api/tenants/realtime-dev/health"]
      interval: 5s
      timeout: 5s
      retries: 40
  supabase:
    restart: on-failure
    image: nginx:1.28-alpine
    depends_on:
      auth: { condition: service_healthy }
      rest: { condition: service_started }
      realtime: { condition: service_healthy }
    ports: ["127.0.0.1:54321:8000"]
    volumes: ["./docker/nginx.conf:/etc/nginx/nginx.conf:ro", "./docker/auth-email.html:/usr/share/nginx/html/auth-email.html:ro"]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8000/auth/v1/health]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    image: postgres:17-alpine
    depends_on:
      auth: { condition: service_healthy }
      realtime: { condition: service_healthy }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ../auth-service/supabase/migrations:/migrations/1-auth-service:ro
      - ../multichat-command/supabase/migrations:/migrations/2-multichat-command:ro
      - ../galindogamerbr-api/supabase/migrations:/migrations/3-galindogamerbr-api:ro
      - ../fs25-monitoring-worker/supabase/migrations:/migrations/4-fs25:ro
      - ./docker/realtime.sql:/realtime.sql:ro
      - ./docker/migrate.sh:/migrate.sh:ro
    entrypoint: [/bin/sh, /migrate.sh]
  mock-platform:
    profiles: ["simulation"]
    image: node:22-bookworm-slim
    environment:
      MOCK_PLATFORM_SECRET: ${MOCK_PLATFORM_SECRET}
    volumes: ["../multichat-reader/scripts/mock-platform.mjs:/app/mock-platform.mjs:ro"]
    command: [node, /app/mock-platform.mjs]
  auth-service:
    build: ../auth-service
    depends_on:
      migrate: { condition: service_completed_successfully }
      supabase: { condition: service_healthy }
    ports: ["127.0.0.1:3003:3000"]
    environment:
      PORT: 3000
      SUPABASE_URL: ${HOSTED_SUPABASE_URL:-http://supabase:8000}
      SUPABASE_SECRET_KEY: ${HOSTED_SUPABASE_SECRET_KEY:-${SERVICE_ROLE_KEY}}
      SUPABASE_JWT_SECRET: ${HOSTED_SUPABASE_JWT_SECRET-${JWT_SECRET}}
      SUPABASE_JWT_ISSUER: ${HOSTED_SUPABASE_URL:-http://localhost:54321}/auth/v1
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      FRONTEND_URL: http://localhost:5173
      MOCK_PLATFORMS: "false"
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      TWITCH_REDIRECT_URI: http://localhost:5173/oauth/twitch/callback
      TWITCH_BROADCASTER_ID: ${TWITCH_BROADCASTER_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: http://localhost:5173/oauth/youtube/callback
      KICK_CLIENT_ID: ${KICK_CLIENT_ID:-}
      KICK_CLIENT_SECRET: ${KICK_CLIENT_SECRET:-}
      KICK_REDIRECT_URI: http://localhost:5173/oauth/kick/callback
      YOUTUBE_LINKING_ENABLED: ${YOUTUBE_LINKING_ENABLED:-false}
      TIKTOK_LINKING_ENABLED: ${TIKTOK_LINKING_ENABLED:-false}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      TIKTOK_REDIRECT_URI: ${TIKTOK_REDIRECT_URI:-}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 20
  command:
    build: ../multichat-command
    depends_on:
      migrate: { condition: service_completed_successfully }
      supabase: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      tiktok-browser: { condition: service_healthy, required: false }
    ports: ["127.0.0.1:3001:3000"]
    environment:
      PORT: 3000
      READER_URL: http://reader:3000
      INTERNAL_WAKE_SECRET: ${INTERNAL_WAKE_SECRET}
      SUPABASE_URL: ${HOSTED_SUPABASE_URL:-http://supabase:8000}
      SUPABASE_SECRET_KEY: ${HOSTED_SUPABASE_SECRET_KEY:-${SERVICE_ROLE_KEY}}
      SUPABASE_JWT_SECRET: ${HOSTED_SUPABASE_JWT_SECRET-${JWT_SECRET}}
      SUPABASE_JWT_ISSUER: ${HOSTED_SUPABASE_URL:-http://localhost:54321}/auth/v1
      AUTH_SERVICE_URL: http://auth-service:3000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      FRONTEND_URL: http://localhost:5173
      YOUTUBE_LIVE_CHAT_ID: ${YOUTUBE_LIVE_CHAT_ID:-}
      LIVE_STATUS_URL: http://gateway/api/live
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_BROADCASTER_ID: ${TWITCH_BROADCASTER_ID:-}
      KICK_BROADCASTER_ID: ${KICK_BROADCASTER_ID:-}
      YOUTUBE_LINKING_ENABLED: ${YOUTUBE_LINKING_ENABLED:-false}
      TIKTOK_LINKING_ENABLED: ${TIKTOK_LINKING_ENABLED:-false}
      TIKTOK_SEND_ENABLED: ${TIKTOK_SEND_ENABLED:-false}
      TIKTOK_BROWSER_URL: http://tiktok-browser:3000
      MOCK_PLATFORMS: "false"
      MOCK_PLATFORM_URL: http://mock-platform:3100
      MOCK_PLATFORM_SECRET: ${MOCK_PLATFORM_SECRET}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 20
  # Chromium headless: login por QR e envio de chat do TikTok (perfis no volume tiktok-browser-data).
  # So sobe com TIKTOK_LINKING_ENABLED=true e `--profile tiktok-link`.
  tiktok-browser:
    profiles: ["tiktok-link"]
    build: ../multichat-command/tiktok-browser
    shm_size: 512m
    environment:
      PORT: 3000
      DATA_DIR: /data
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      CHROMIUM_NO_SANDBOX: "true"
      DEBUG_LOGIN: ${DEBUG_LOGIN:-false}
    volumes: [tiktok-browser-data:/data]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 20
  reader:
    build: ../multichat-reader
    depends_on:
      migrate: { condition: service_completed_successfully }
      supabase: { condition: service_healthy }
    ports: ["127.0.0.1:3002:3000"]
    environment:
      PORT: 3000
      SUPABASE_URL: ${HOSTED_SUPABASE_URL:-http://supabase:8000}
      SUPABASE_SECRET_KEY: ${HOSTED_SUPABASE_SECRET_KEY:-${SERVICE_ROLE_KEY}}
      INTERNAL_WAKE_SECRET: ${INTERNAL_WAKE_SECRET}
      AUTO_START: "true"
      TWITCH_CHANNEL: galindogamerbr
      TWITCH_ACCESS_TOKEN: ${TWITCH_ACCESS_TOKEN:-}
      TWITCH_REFRESH_TOKEN: ${TWITCH_REFRESH_TOKEN:-}
      TWITCH_READER_USER_ID: ${TWITCH_READER_USER_ID:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YOUTUBE_LIVE_STATUS_URL: http://portal-api:3000/api/live
      YOUTUBE_TRANSPORT: ${YOUTUBE_TRANSPORT:-stream}   # stream (gRPC em janelas, polling de reserva) | poll
      TIKTOK_USERNAME: galindogamerbr
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      TWITCH_BROADCASTER_ID: ${TWITCH_BROADCASTER_ID:-}
      KICK_CLIENT_ID: ${KICK_CLIENT_ID:-}
      KICK_CLIENT_SECRET: ${KICK_CLIENT_SECRET:-}
      KICK_BROADCASTER_ID: ${KICK_BROADCASTER_ID:-}
      MOCK_PLATFORMS: "false"
      MOCK_PLATFORM_URL: http://mock-platform:3100
      MOCK_PLATFORM_SECRET: ${MOCK_PLATFORM_SECRET}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 20
  portal-api:
    build: ../galindogamerbr-api
    depends_on:
      migrate: { condition: service_completed_successfully }
      supabase: { condition: service_healthy }
    ports: ["127.0.0.1:3004:3000"]
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      DATABASE_SCHEMA: portal
      SUPABASE_URL: ${HOSTED_SUPABASE_URL:-http://supabase:8000}
      SUPABASE_JWT_SECRET: ${HOSTED_SUPABASE_JWT_SECRET-${JWT_SECRET}}
      SUPABASE_JWT_ISSUER: ${HOSTED_SUPABASE_URL:-http://localhost:54321}/auth/v1
      ENVIRONMENT: development
      FS25_BISECT_API_KEY: ${FS25_BISECT_API_KEY:-}
      FS25_BISECT_SERVER_UUID: ${FS25_BISECT_SERVER_UUID:-}
      FS25_BISECT_PANEL_BASE_URL: ${FS25_BISECT_PANEL_BASE_URL:-}
      FS25_BISECT_PANEL_USERNAME: ${FS25_BISECT_PANEL_USERNAME:-}
      FS25_BISECT_PANEL_PASSWORD: ${FS25_BISECT_PANEL_PASSWORD:-}
      FS25_XML_CODE: ${FS25_XML_CODE:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YOUTUBE_CHANNEL_ID: ${YOUTUBE_CHANNEL_ID:-}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 20
  # Espelha o roteamento por caminho do Caddy de producao (deploy-platform/Caddyfile) para o desenvolvimento local.
  gateway:
    image: traefik:v3.1
    depends_on:
      auth-service: { condition: service_healthy }
      command: { condition: service_healthy }
      portal-api: { condition: service_healthy }
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
    ports: ["127.0.0.1:${GATEWAY_PORT:-8088}:80"]
    volumes: ["./docker/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro"]
  # Frontend estatico em modo dev (Vite); chamadas de backend passam pelo gateway (mesma origem, como o proxy do Pages).
  portal:
    image: node:22-bookworm-slim
    depends_on:
      gateway: { condition: service_started }
    working_dir: /app
    ports: ["127.0.0.1:5173:5173"]
    environment:
      # Padrao: GoTrue local. Para testar o login contra o Supabase hospedado, defina HOSTED_SUPABASE_URL e HOSTED_SUPABASE_PUBLISHABLE_KEY (e, para o backend, HOSTED_SUPABASE_SECRET_KEY e HOSTED_SUPABASE_JWT_SECRET) no .env.docker.
      VITE_SUPABASE_URL: ${HOSTED_SUPABASE_URL:-http://localhost:54321}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${HOSTED_SUPABASE_PUBLISHABLE_KEY:-${ANON_KEY}}
      VITE_MULTICHAT_COMMAND_URL: http://localhost:5173
      VITE_API_PROXY: http://gateway:80
      VITE_USE_POLLING: "true"   # o volume do Docker Desktop nao propaga eventos de arquivo ao Vite
      VITE_YOUTUBE_LINKING_ENABLED: ${YOUTUBE_LINKING_ENABLED:-false}
      VITE_TIKTOK_LINKING_ENABLED: ${TIKTOK_LINKING_ENABLED:-false}
    volumes:
      - .:/app
      - portal-node-modules:/app/node_modules
    command: ["sh", "-c", "npm ci && npx vite --host 0.0.0.0"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:5173/').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      start_period: 90s
      retries: 30
  # --- FS25 (precisa de credenciais reais do Bisect): docker compose --profile fs25 up ---
  fs25-monitor:
    profiles: ["fs25"]
    build: ../fs25-monitoring-worker
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      STATUS_TOKEN: ${STATUS_TOKEN}
      FS25_BISECT_API_KEY: ${FS25_BISECT_API_KEY:-}
      FS25_BISECT_SERVER_UUID: ${FS25_BISECT_SERVER_UUID:-}
      FS25_BISECT_PANEL_BASE_URL: ${FS25_BISECT_PANEL_BASE_URL:-}
      FS25_BISECT_PANEL_USERNAME: ${FS25_BISECT_PANEL_USERNAME:-}
      FS25_BISECT_PANEL_PASSWORD: ${FS25_BISECT_PANEL_PASSWORD:-}
      FS25_XML_CODE: ${FS25_XML_CODE:-}
      DISCORD_WEBHOOK_URL: ${FS25_DISCORD_WEBHOOK_URL:-}
    ports: ["127.0.0.1:3005:3000"]
  fs25-mods-sync:
    profiles: ["fs25"]
    build: ../fs25-mods-sync
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      API_KEY: ${STATUS_TOKEN}
      MODS_DIR: /data/mods
      BLOB_PUBLIC_BASE_URL: http://localhost:8081
      FS25_PANEL_BASE_URL: ${FS25_BISECT_PANEL_BASE_URL:-}
      FS25_XML_CODE: ${FS25_XML_CODE:-}
      FTP_HOST: ${FS25_FTP_HOST:-}
      FTP_USER: ${FS25_FTP_USER:-}
      FTP_PASSWORD: ${FS25_FTP_PASSWORD:-}
    volumes: ["mods-data:/data/mods"]
    ports: ["127.0.0.1:3006:3000"]
  mods-files:
    profiles: ["fs25"]
    image: nginxinc/nginx-unprivileged:1.27-alpine
    volumes:
      - mods-data:/data/mods:ro
      - ./docker/mods-files.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:8081:8080"]
  # Cron de estatisticas sob demanda: docker compose --profile jobs run --rm social-stats
  social-stats:
    profiles: ["jobs"]
    build: ../galindogamerbr-api
    depends_on:
      migrate: { condition: service_completed_successfully }
    command: ["node", "dist/jobs/social-stats/main.js", "collect"]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      DATABASE_SCHEMA: portal
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      # Instagram (token da Meta; renovado e guardado no banco na 1a rodada) e TikTok (renova o token do admin).
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
volumes:
  multichat-db:
  portal-node-modules:
  mods-data:
  tiktok-browser-data:
