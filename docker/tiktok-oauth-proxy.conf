server {
  listen 8080;
  access_log off;
  error_log /dev/stderr crit;
  resolver 127.0.0.11 valid=10s;
  set $backend http://command:3000;
  location = /oauth/tiktok/authorize {
    limit_except GET { deny all; }
    proxy_pass $backend;
    proxy_set_header Host $host;
  }
  location = /oauth/tiktok/callback {
    limit_except GET { deny all; }
    proxy_pass $backend;
    proxy_set_header Host $host;
  }
  location / { return 404; }
}
