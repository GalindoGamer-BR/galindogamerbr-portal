events {}
http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $http_authorization $auth_header { default $http_authorization; "" "Bearer $http_apikey"; }
  server {
    listen 8000;
    client_max_body_size 1m;
    add_header Access-Control-Allow-Origin "http://localhost:5173" always;
    add_header Access-Control-Allow-Headers "authorization,apikey,content-type,x-client-info,x-supabase-api-version" always;
    add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
    if ($request_method = OPTIONS) { return 204; }
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_set_header Authorization $auth_header;
    location /auth/v1/ { proxy_pass http://auth:9999/; proxy_set_header X-Forwarded-Proto http; proxy_set_header Host $host; }
    location /rest/v1/ { proxy_pass http://rest:3000/; }
    location /realtime/v1/websocket {
      proxy_pass http://realtime:4000/socket/websocket;
      proxy_set_header Host realtime-dev.localhost;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }
    location /realtime/v1/ {
      proxy_pass http://realtime:4000/;
      proxy_set_header Host realtime-dev.localhost;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }
  }
}
